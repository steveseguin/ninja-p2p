name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_THREADPOOL_SIZE: "1"
  NODE_OPTIONS: "--v8-pool-size=1"
  CMAKE_BUILD_PARALLEL_LEVEL: "1"

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.adapter.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [20, 22, 24]
        adapter:
          - name: wrtc
            package: "@roamhq/wrtc@^0.8.0"
            expected: "@roamhq/wrtc"
          - name: wrtc-current
            package: "@roamhq/wrtc@^0.10.0"
            expected: "@roamhq/wrtc"
          - name: node-datachannel
            package: "node-datachannel@^0.32.3"
            expected: "node-datachannel"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Use npm 10 for isolated adapter installs
        run: npm install --global npm@10.9.8

      - name: Install without an implicit WebRTC adapter
        run: npm install --omit=optional

      - name: Install ${{ matrix.adapter.name }}
        env:
          WEBRTC_PACKAGE: ${{ matrix.adapter.package }}
        run: npm install --no-save "$WEBRTC_PACKAGE"

      - name: Test and build
        run: npm run check

      - name: Verify selected adapter
        run: node scripts/validate-adapter.mjs "${{ matrix.adapter.expected }}"

  install-smoke:
    name: Node 24 / current npm / ${{ matrix.adapter.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        adapter:
          - name: wrtc
            package: "@roamhq/wrtc@^0.8.0"
            expected: "@roamhq/wrtc"
          - name: wrtc-current
            package: "@roamhq/wrtc@^0.10.0"
            expected: "@roamhq/wrtc"
          - name: node-datachannel
            package: "node-datachannel@^0.32.3"
            expected: "node-datachannel"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the documented Node dependency set
        env:
          WEBRTC_PACKAGE: ${{ matrix.adapter.package }}
        run: npm install --no-save "$WEBRTC_PACKAGE"

      - name: Test and build
        run: npm run check

      - name: Verify selected adapter
        run: node scripts/validate-adapter.mjs "${{ matrix.adapter.expected }}"

  mailbox:
    name: Mailbox / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --omit=optional
      - run: npm ci --prefix mailbox-service --ignore-scripts
      - run: npm run test:mailbox
