name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  UV_THREADPOOL_SIZE: "1"
  NODE_OPTIONS: "--v8-pool-size=1"
  CMAKE_BUILD_PARALLEL_LEVEL: "1"

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies with the recommended WebRTC adapter
        run: npm install --no-save "@roamhq/wrtc@^0.10.0"

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"

      - name: Test and build
        run: npm run check

      - name: Install mailbox dependencies
        run: npm ci --prefix mailbox-service --ignore-scripts

      - name: Test mailbox security and workers
        run: npm run test:mailbox

      - name: Verify selected WebRTC adapter
        run: node scripts/validate-adapter.mjs "@roamhq/wrtc"

      - name: Use current npm with trusted publishing support
        run: npm install --global npm@latest

      - name: Publish package
        run: npm publish --access public --provenance
